services:
  ollama:
    image: ollama/ollama
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"

  bot:
    build: .
    depends_on:
      - ollama
    env_file: .env
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434/v1

volumes:
  ollama_data: