<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChainCheck</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="frame">
    <div class="chat-shell">
      <div class="topbar">
        <div class="logo-row-sm" id="backToStart">
          <svg width="22" height="22" viewBox="0 0 30 30" fill="none" aria-hidden="true">
            <path d="M15 2L26 7V15C26 21.5 21.2 26.8 15 28C8.8 26.8 4 21.5 4 15V7L15 2Z" fill="#1f3a5f"/>
            <path d="M10.5 15L13.5 18L20 11" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span class="logo-text-sm">ChainCheck</span>
        </div>
        <div class="disclosure-badge">
          You're chatting with an AI assistant
          <span class="info-dot" tabindex="0">i</span>
          <div class="info-tooltip">This response is generated by an AI model reasoning over on-chain data. It does not replace professional or legal advice.</div>
        </div>
        <label class="admin-toggle">
          <input type="checkbox" id="adminToggle" />
          <span>View as admin</span>
        </label>
      </div>
      <div class="body-row">
        <div class="sidebar" id="sidebar" style="display:none;">
          <div class="sidebar-label-row">
            <p class="sidebar-label">Connected sources</p>
          </div>
          <div class="source-item active" data-source="Etherscan API" tabindex="0">
            Etherscan API
            <span class="source-dot"></span>
          </div>
          <div class="source-item" data-source="DexScreener API" tabindex="0">
            DexScreener API
            <span class="source-dot"></span>
          </div>
          <button class="add-source" id="addSourceBtn">+ add source</button>
        </div>
        <div class="main-area">
          <div class="thread" id="thread">
            <p class="prompt-hint" id="promptHint">How can I help you today?</p>
          </div>
          <div class="input-row">
            <div class="plus-wrap">
              <button class="plus-icon" id="plusIcon" aria-label="Attach a file">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <path d="M17 8L9.5 15.5C8.4 16.6 6.6 16.6 5.5 15.5C4.4 14.4 4.4 12.6 5.5 11.5L13.5 3.5C14.9 2.1 17.1 2.1 18.5 3.5C19.9 4.9 19.9 7.1 18.5 8.5L11 16C10.4 16.6 9.4 16.6 8.8 16C8.2 15.4 8.2 14.4 8.8 13.8L15 7.5" stroke="#33404f" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </button>
              <div class="plus-icon-tooltip">Attach a file</div>
            </div>
            <input type="text" id="chatInput" placeholder="Paste an address, contract, or ask a question" />
          </div>
        </div>
      </div>
    </div>
  </div>

  <template id="aiMsgTemplate">
    <div class="msg-ai">
      <div class="msg-ai-label">
        <span class="msg-ai-dot"></span>
        <span class="msg-ai-label-text">AI generated response</span>
      </div>
      <p class="msg-ai-text"></p>
    </div>
  </template>

  <template id="fileChipTemplate">
    <div class="file-chip">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z" stroke="#33404f" stroke-width="1.6"/>
        <path d="M14 2v6h6" stroke="#33404f" stroke-width="1.6"/>
      </svg>
      contract_snapshot.pdf
    </div>
  </template>

  <script src="script.js"></script>
</body>
</html>
